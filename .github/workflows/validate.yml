name: Boomi Validate

# Lints the exact packaged version of every component in the proposed release.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:   # started by Boomi Release Request on release/next

jobs:
  lint:
    name: Boomi lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Lint packaged components
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          FAIL_ON: ${{ vars.BOOMI_LINT_FAIL_ON }}
        run: python -m boomi_release lint --fail-on "$FAIL_ON"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lint-report
          path: lint-report.md
          if-no-files-found: ignore

name: Boomi Validate

# Lints the exact packaged version of every component in the proposed release.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:   # started by Boomi Release Request on release/next

jobs:
  lint:
    name: Boomi lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write   # publish the result on the release PR (see last step)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Lint packaged components
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          FAIL_ON: ${{ vars.BOOMI_LINT_FAIL_ON }}
        run: python -m boomi_release lint --fail-on "$FAIL_ON"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lint-report
          path: lint-report.md
          if-no-files-found: ignore

      # Runs started by workflow_dispatch don't appear in a pull request's checks, so publish the
      # result as a commit status on the release branch head — visible on the PR and usable as a
      # required status check ("Boomi lint") in branch protection.
      - name: Publish result to the release PR
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$OUTCOME" in success) state=success; desc="Boomi lint passed" ;; *) state=failure; desc="Boomi lint failed — see the run" ;; esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --silent \
            -f state="$state" -f context="Boomi lint" -f description="$desc" -f target_url="$RUN_URL"

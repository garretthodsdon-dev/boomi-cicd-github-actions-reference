name: Unit tests

# Tests the release tooling itself. Needs no Boomi account or secrets.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
